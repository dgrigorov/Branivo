version: '3.9'

# Test environment — used by NestJS integration tests
# Usage: docker compose -f docker-compose.test.yml up -d
# Then: cd branivo-api && npm run test:e2e

services:
  postgres-test:
    image: postgres:16
    container_name: branivo-postgres-test
    environment:
      POSTGRES_USER: branivo
      POSTGRES_PASSWORD: branivo
      POSTGRES_DB: branivo_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: branivo-redis-test
    ports:
      - '6380:6379'
