# Local development stack — replaces AWS services locally
# Usage: docker compose up -d
# Then: cd branivo-api && npm run start:dev

services:
  postgres:
    image: postgres:16
    container_name: branivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: branivo
      POSTGRES_PASSWORD: branivo
      POSTGRES_DB: branivo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U branivo -d branivo_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: branivo-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: branivo-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: branivo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@branivo.bg
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mailhog:
    image: mailhog/mailhog:latest
    container_name: branivo-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI

  branivo-ocr:
    build:
      context: ./branivo-ocr
      dockerfile: Dockerfile
    container_name: branivo-ocr
    restart: unless-stopped
    ports:
      - '8888:8000'
    mem_limit: 3g
    memswap_limit: 3g
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
